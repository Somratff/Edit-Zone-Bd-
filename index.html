<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EDIT ZONE BD</title><link rel="stylesheet" href="/style.css"></head><body>
<header><nav><b>EDIT ZONE BD</b><button onclick="admin()">Admin Login</button></nav><div class="hero"><small>TEMPLATE LIBRARY</small><h1>EDIT ZONE BD</h1><p>Templates দেখুন, preview করুন এবং download করুন।</p></div></header><main><div class="bar"><h2>Latest Templates</h2><input id="q" placeholder="Search templates..."></div><section id="grid"></section></main>
<div id="modal"><div class="box"><button class="x" onclick="closeM()">×</button><h2>Admin Panel</h2><div id="login"><input id="pw" type="password" placeholder="Admin password"><button class="primary" onclick="login()">Login</button><p id="err"></p></div><div id="panel" style="display:none"><label>Template Name</label><input id="title"><label>Description</label><textarea id="desc"></textarea><label>Preview Picture</label><input id="image" type="file" accept="image/*"><label>Template File</label><input id="file" type="file"><button class="primary" onclick="upload()">Upload Template</button><h3>Uploaded</h3><div id="list"></div><button onclick="logout()">Logout</button></div></div></div>
<script>
let token=localStorage.getItem("EZBD_TOKEN")||"",all=[];
const $=x=>document.getElementById(x);
function closeM(){$("modal").style.display="none"}function admin(){$("modal").style.display="block";if(token){$("login").style.display="none";$("panel").style.display="block";renderAdmin()}}
async function login(){let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("pw").value})}),d=await r.json();if(!r.ok){$("err").textContent=d.error;return}token=d.token;localStorage.setItem("EZBD_TOKEN",token);$("login").style.display="none";$("panel").style.display="block";renderAdmin()}
async function logout(){await fetch("/api/logout",{method:"POST",headers:{Authorization:"Bearer "+token}});token="";localStorage.removeItem("EZBD_TOKEN");closeM()}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
async function load(){all=await(await fetch("/api/templates")).json();render()}function render(){let q=$("q").value.toLowerCase();$("grid").innerHTML=all.filter(t=>(t.title+" "+t.description).toLowerCase().includes(q)).map(t=>`<article><img src="${t.image_url}"><div><h3>${esc(t.title)}</h3><p>${esc(t.description)}</p><a class="primary" href="${t.file_url}" download>Download</a><button onclick="share('${location.origin}/template.html?id=${t.id}')">Share</button></div></article>`).join("")}
function renderAdmin(){$("list").innerHTML=all.map(t=>`<div class="item"><img src="${t.image_url}"><span>${esc(t.title)}</span><button onclick="del(${t.id})">Delete</button></div>`).join("")}
async function upload(){let f=new FormData();f.append("title",$("title").value);f.append("description",$("desc").value);if($("image").files[0])f.append("image",$("image").files[0]);if($("file").files[0])f.append("file",$("file").files[0]);let r=await fetch("/api/templates",{method:"POST",headers:{Authorization:"Bearer "+token},body:f}),d=await r.json();if(!r.ok)return alert(d.error);alert("Uploaded");$("title").value="";$("desc").value="";$("image").value="";$("file").value="";await load();renderAdmin()}
async function del(id){if(confirm("Delete?")){await fetch("/api/templates/"+id,{method:"DELETE",headers:{Authorization:"Bearer "+token}});await load();renderAdmin()}}
async function share(u){try{await navigator.clipboard.writeText(u);alert("Link copied")}catch{prompt("Copy link",u)}}$("q").oninput=render;load();
</script></body></html>
